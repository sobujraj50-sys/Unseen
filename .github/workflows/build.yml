What v0.3.0 added
Pause and resume: `UnseenVpnService` actions PAUSE/RESUME. A 10-minute pause closes the tunnel, so the VPN and its key icon go away. A Handler resumes it; the notification has a "Resume now" action. State is the `Protection` enum (OFF/ON/PAUSED).
Quick Settings tile: `vpn/ProtectionTileService.kt`.
Needs `unlockAndRun` when the phone is locked.
Turning it off with the app lock on opens `MainActivity` with `ACTION_REQUEST_OFF`.
If starting the service is refused, it falls back to opening the app.
App lock: `ui/Auth.kt` uses the framework `BiometricPrompt` (BIOMETRIC_WEAK | DEVICE_CREDENTIAL on 30+, `setDeviceCredentialAllowed` on 29).
Asked for: turning protection off, pausing, pausing an app, allowing a domain, turning off a filter, changing the lock itself.
Exposed to Compose through `LocalAuth`.
Turned-off alert: `onRevoke` sends a high-priority notification and writes an `EventLog` entry. `data/EventLog.kt` keeps the last 50 events, shown in Settings → Activity.
Always-on VPN: `isAlwaysOn` / `isLockdownEnabled` are read after each `establish()`. Settings shows a guide and warns if lockdown is on, because lockdown would cut the internet.
Categories: `dns/Blocklist.kt` has `Category` SCAM/TRACKER/AD/GAMBLING, `classify()`, `categoryOf()`, an allowlist, and `Lookalike` (fake bKash/Nagad domains).
Lists are downloaded by `data/ListUpdater.kt` with WorkManager (daily plus once on first run), with mirrors.
Ads + gambling come from StevenBlack. Scams come from malware-filter's phishing-filter-hosts + urlhaus-filter-hosts-online.
Toggles: ads ON, scams ON, gambling OFF by default.
Scam alert: a notification when a SCAM domain is blocked, rate-limited to once per domain per 10 minutes.
Stats: `data/Stats.kt` now saves to disk.
Daily totals by category are kept 60 days; per-app and per-domain counts 7 days. Saves are debounced by 5 s.
`DayCounts.dataSavedBytes` is an estimate: 3 KB per tracker, 30 KB per ad, shown as "about".
Weekly report: `data/WeeklyReport.kt`, a WorkManager job every 7 days starting next Friday 20:00, with a Share action.
Share card: `ui/ShareCard.kt` draws a 1080×1350 PNG and shares it via FileProvider (`${applicationId}.files`, `res/xml/file_paths.xml`).
Privacy grade: `data/PrivacyGrade.kt` gives A–F. Score = 100 − 12 × tracker companies (max 5) − 8 × sensitive permissions (max 5).
Onboarding: a first-run welcome screen that explains the key icon. Rocket (`com.dbbl.mbs.apps.main`) was added to the default-paused list.
Settings screen: what to block, list status with "Update now", app lock, always-on guide, allowed sites, activity history, about/credits.
New dependency: `androidx.work:work-runtime-ktx:2.10.0`. New permission: `USE_BIOMETRIC`. versionCode 4 / versionName 0.3.0.
