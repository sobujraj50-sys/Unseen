How it works (v0.1)
A local `VpnService` routes only the fake DNS server `10.111.222.1/32` into the tunnel and sets it as the phone's DNS server. All other traffic goes out directly.
The tunnel reader (non-blocking fd + `Os.poll`) parses IPv4/UDP port 53 and reads the DNS question.
If the domain (or a parent domain) is in `assets/blocklist.txt` (~90 tracker/ad SDK domains), it answers `0.0.0.0` / `::`.
Otherwise it forwards the query over UDP to 1.1.1.1, then 8.8.8.8, using a protected socket.
`getConnectionOwnerUid()` finds which app made each blocked request; results go into per-app stats.
The app adds itself with `addDisallowedApplication`. Apps the user paused are added the same way, so they bypass the VPN.
Foreground service type is `specialUse`. `BootReceiver` turns protection back on after a reboot if it was on.
Source layout (`app/src/main/java/io/github/abusaeedbd/unseen/`)
`UnseenApp.kt`: starts CrashLog, Stats and Blocklist.
`vpn/UnseenVpnService.kt`: the tunnel, DNS block/forward and notification. `vpn/BootReceiver.kt`: restart after reboot.
`dns/DnsMessage.kt`, `dns/IpUdpPacket.kt`, `dns/Blocklist.kt` (`DomainMatcher`): pure Kotlin, unit-tested in `app/src/test/.../dns/DnsTest.kt`.
`data/Prefs.kt`: whether protection should be on, and the paused apps. `data/Stats.kt`: blocked today plus per-app counts (in memory). `data/AppNames.kt`: uid to package and label. `data/CrashLog.kt`: saves the last crash to a file.
`ui/MainActivity.kt`: VPN consent, notification permission, Private DNS check. `ui/Screens.kt`: Home (big toggle, counter, top apps, Private DNS warning, crash card) and Apps (per-app protect switches). `ui/Theme.kt`.
`.github/workflows/build.yml`: runs `./gradlew testDebugUnitTest assembleDebug` and uploads the debug APK as an artifact.
