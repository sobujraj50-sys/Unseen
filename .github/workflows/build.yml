Handoff — Unseen (Android tracker blocker)
Last updated: 2026-11-22, 22:15 (Asia/Dhaka)
What it is
Unseen is an Android app that blocks the trackers hidden inside other apps with one tap, without turning off any app permissions, so the apps keep working.
Tagline: "Apps can't watch what they can't see."
Owner: Abu Saeed (GitHub `Abusaeed-bd`). He speaks Bengali, so talk to him in Bengali. The app's UI is English only.
He wants things simple: one-tap solutions, not long settings checklists.
Repo: `https://github.com/Abusaeed-bd/Unseen` (public, uploaded by hand through the GitHub website).
